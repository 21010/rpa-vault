[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rpa-vault"
version = "1.0.1"
description = "Vaults integration for Python RPA"
readme = "README.md"
authors = [{ name = "Grzegorz Ziolo", email = "grzegorz.ziolo@gmail.com" }]
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
keywords = ["rpa", "vault"]
dependencies = [
    "azure-identity >= 1.25.3",
    "azure-keyvault-secrets >= 4.11.2",
    "pydantic >= 2.13.4",
]
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/21010/rpa-vault"

[tool.hatch.build.targets.wheel]
packages = ["src/rpa_vault"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: marks tests as integration tests that require external resources (deselect with '-m \"not integration\"')",
]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.pyrefly]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "pyrefly",
    "bandit",
    "pytest-cov>=7.1.0",
]
